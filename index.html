<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegant API Cards</title>

  <!-- Bootstrap 5 CSS -->
  <link href="bootstrap.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero-section text-center text-white py-5 mb-5">
    <div class="container">
      <h1 class="display-4 fw-bold">Explore Dynamic Products</h1>
      <p class="lead opacity-75">Fetch API se loaded 35 elegant responsive cards</p>
    </div>
  </header>

  <!-- Cards Container -->
  <main class="container mb-5">
    
    <!-- Loading Spinner -->
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-primary spinner-custom" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 text-muted">Data load ho raha hai...</p>
    </div>

    <!-- Dynamic Grid Row -->
    <div id="cards-container" class="row g-4"></div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="bootstrap.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
